services:

  ui:
    # Built locally from this checkout (no third-party registry, no :latest).
    build:
      context: .
      dockerfile: ./ui/Dockerfile
    image: gm-smtp-relay/ui:local
    container_name: smtp-relay-ui
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: "sqlite+aiosqlite:////data/relay.db"
      ARCHIVE_PATH: "/data/archive"
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-8}
      UI_LOGIN_BAN_THRESHOLD: ${UI_LOGIN_BAN_THRESHOLD:-5}
      UI_LOGIN_BAN_DURATION_MIN: ${UI_LOGIN_BAN_DURATION_MIN:-30}
      ADMIN_RESET: ${ADMIN_RESET:-0}
      ADMIN_NEW_PASSWORD: ${ADMIN_NEW_PASSWORD:-}
      APP_NAME: ${APP_NAME:-SMTP Relay}
      # Address uvicorn trusts X-Forwarded-For from: the nginx container's
      # pinned static IP (see the nginx service + network ipam below). Trusting
      # only the proxy — not '*' — prevents source-IP spoofing via a forged
      # X-Forwarded-For (ban evasion, audit-log poisoning).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.10}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - relay-internal

  relay:
    # Built locally from this checkout (no third-party registry, no :latest).
    build:
      context: .
      dockerfile: ./relay/Dockerfile
    image: gm-smtp-relay/relay:local
    container_name: smtp-relay-smtp
    restart: unless-stopped
    ports:
      # 25 and 587: plain + STARTTLS, 465: SMTPS (implicit TLS).
      - "${SMTP_BIND_HOST:-0.0.0.0}:${SMTP_BIND_PORT:-25}:2525"
      - "${SMTP_BIND_HOST:-0.0.0.0}:${SMTP_SUBMISSION_PORT:-587}:2525"
      - "${SMTP_BIND_HOST:-0.0.0.0}:${SMTPS_BIND_PORT:-465}:2465"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      DATABASE_URL: "sqlite+aiosqlite:////data/relay.db"
      ARCHIVE_PATH: "/data/archive"
      SMTP_LISTEN_HOST: "0.0.0.0"
      SMTP_LISTEN_PORT: "2525"
      SMTPS_LISTEN_PORT: "2465"
      SMTP_MAX_MESSAGE_SIZE: ${SMTP_MAX_MESSAGE_SIZE:-31457280}
      SMTP_MAX_RECIPIENTS: ${SMTP_MAX_RECIPIENTS:-100}
      # Off by default: no copy of delivered mail (see docs/08-betrieb.md).
      ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-0}
      # TLS is always on. Without SMTP_TLS_CERT/KEY a self-signed certificate
      # is generated once into /data/smtp-tls (see docs/06-tls.md).
      SMTP_TLS_CERT: ${SMTP_TLS_CERT:-}
      SMTP_TLS_KEY: ${SMTP_TLS_KEY:-}
      SMTP_TLS_HOSTNAME: ${SMTP_TLS_HOSTNAME:-}
      SMTP_TLS_MIN_VERSION: ${SMTP_TLS_MIN_VERSION:-1.2}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - data:/data
      # Own certificate: uncomment and set SMTP_TLS_CERT=/tls/cert.pem,
      # SMTP_TLS_KEY=/tls/key.pem in .env (files readable by uid 1000).
      # - ./smtp-tls:/tls:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ui
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; [socket.create_connection(('127.0.0.1', p), 3) for p in (2525, 2465)]"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - relay-internal

  nginx:
    # Built locally from this checkout (no third-party registry, no :latest).
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    image: gm-smtp-relay/nginx:local
    container_name: smtp-relay-nginx
    restart: unless-stopped
    ports:
      # Host keeps the conventional 80/443; the container listens unprivileged
      # on 8080/8443 (nginx runs as uid 101).
      - "${HTTP_BIND_HOST:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${HTTPS_BIND_HOST:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - certs:/etc/nginx/certs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ui
    networks:
      relay-internal:
        # Pinned so the UI can trust X-Forwarded-For from exactly this address.
        ipv4_address: 172.28.0.10

volumes:
  data:
    name: smtp-relay-data
  certs:
    name: smtp-relay-certs

networks:
  relay-internal:
    name: smtp-relay-internal
    driver: bridge
    ipam:
      config:
        # Fixed subnet so nginx can hold a static IP (172.28.0.10) that the UI
        # trusts for X-Forwarded-For. Change here + in FORWARDED_ALLOW_IPS if
        # this range collides with an existing network on the host.
        - subnet: 172.28.0.0/24
