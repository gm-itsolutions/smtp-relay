# VPS override: SMTP and the admin UI reachable from the internet.
# Activate with COMPOSE_FILE=docker-compose.yml:docker-compose.vps.yml in .env
# (see docs/12-vps.md). Needs Docker Compose >= 2.24 for !override.
services:
  relay:
    # No port 25 on the internet: only submission (587, STARTTLS) and SMTPS (465).
    ports: !override
      - "${SMTP_BIND_HOST:?SMTP_BIND_HOST must be the public IP}:${SMTP_SUBMISSION_PORT:-587}:2525"
      - "${SMTP_BIND_HOST:?SMTP_BIND_HOST must be the public IP}:${SMTPS_BIND_PORT:-465}:2465"
    environment:
      SMTP_PUBLIC_MODE: "1"
      # Let's Encrypt certificate, copied here by deploy/letsencrypt-deploy-hook.sh.
      SMTP_TLS_CERT: /tls/cert.pem
      SMTP_TLS_KEY: /tls/key.pem
    volumes:
      - ./smtp-tls:/tls:ro

  ui:
    environment:
      SMTP_PUBLIC_MODE: "1"

  nginx:
    # HTTPS only; port 80 stays free for certbot (HTTP-01 challenge).
    ports: !override
      - "${HTTPS_BIND_HOST:?HTTPS_BIND_HOST must be the public IP}:${HTTPS_PORT:-443}:8443"
    # Same Let's Encrypt certificate, copy owned by the nginx user (uid 101).
    volumes: !override
      - ./smtp-tls/nginx:/etc/nginx/certs:ro
